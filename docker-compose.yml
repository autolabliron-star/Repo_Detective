services:
  detective:
    build: .
    # `docker compose up` serves the web UI at http://localhost:8000 (case files, live logs,
    # budget approvals, chat). The CLI is one command away and shares the same case files:
    #   docker compose run --rm detective investigate https://github.com/expressjs/express
    #   docker compose run --rm detective chat expressjs/express
    # (run allocates a TTY, which the terminal budget prompt needs.)
    ports:
      - "${DETECTIVE_PORT:-8000}:8000"
    stdin_open: true
    tty: true
    environment:
      # Interpolated from your shell or from ./.env (compose loads it automatically).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DETECTIVE_BUDGET=${DETECTIVE_BUDGET:-}
    volumes:
      - ./investigations:/app/investigations
    # Lets OPENAI_BASE_URL=http://host.docker.internal:<port>/v1 reach a local model on Linux
    # too (Docker Desktop on macOS/Windows resolves the name by itself).
    extra_hosts:
      - "host.docker.internal:host-gateway"
